name: Tracker feed
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "shuhud-bot"
          git config user.email "shuhud-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Tracker: hourly feed update"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
